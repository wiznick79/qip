name: qip

services:
  qip:
    image: ${QIP_IMAGE:-qip:local}
    build:
      context: .
      target: runtime
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${QIP_SPRING_PROFILES:-local,ollama}
      QIP_DB_HOST: postgres
      QIP_DB_PORT: 5432
      QIP_DB_NAME: ${QIP_DB_NAME:-qip}
      QIP_DB_USERNAME: ${QIP_DB_USERNAME:-qip}
      QIP_DB_PASSWORD: ${QIP_DB_PASSWORD:-qip-local-only}
      QIP_DOCUMENT_STORAGE_DIRECTORY: /app/data/documents
      QIP_INVESTIGATOR_USERNAME: ${QIP_INVESTIGATOR_USERNAME:-qip-investigator}
      QIP_INVESTIGATOR_PASSWORD: ${QIP_INVESTIGATOR_PASSWORD:-qip-investigator-local-only}
      QIP_REVIEWER_USERNAME: ${QIP_REVIEWER_USERNAME:-qip-reviewer}
      QIP_REVIEWER_PASSWORD: ${QIP_REVIEWER_PASSWORD:-qip-reviewer-local-only}
      QIP_ADMIN_USERNAME: ${QIP_ADMIN_USERNAME:-qip-admin}
      QIP_ADMIN_PASSWORD: ${QIP_ADMIN_PASSWORD:-qip-admin-local-only}
      QIP_OLLAMA_BASE_URL: ${QIP_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      QIP_OLLAMA_CHAT_MODEL: ${QIP_OLLAMA_CHAT_MODEL:-qwen3-coder:30b}
      QIP_OLLAMA_EMBEDDING_MODEL: ${QIP_OLLAMA_EMBEDDING_MODEL:-nomic-embed-text:latest}
      QIP_OLLAMA_CONNECT_TIMEOUT: ${QIP_OLLAMA_CONNECT_TIMEOUT:-5s}
      QIP_OLLAMA_READ_TIMEOUT: ${QIP_OLLAMA_READ_TIMEOUT:-3m}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${QIP_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - qip-document-data:/app/data/documents

  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    environment:
      POSTGRES_DB: ${QIP_DB_NAME:-qip}
      POSTGRES_USER: ${QIP_DB_USERNAME:-qip}
      POSTGRES_PASSWORD: ${QIP_DB_PASSWORD:-qip-local-only}
    ports:
      - "${QIP_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - qip-postgres-data:/var/lib/postgresql/data

volumes:
  qip-document-data:
  qip-postgres-data:

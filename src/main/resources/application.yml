spring:
  application:
    name: qip
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

qip:
  documents:
    storage-directory: ${QIP_DOCUMENT_STORAGE_DIRECTORY:./data/documents}
    max-upload-bytes: 10485760
    max-pages: 500
    max-extracted-characters: 5000000
  knowledge:
    chunk-size: 800
    chunk-overlap: 120
    embedding-batch-size: 32
    fake-embedding-dimensions: 64
    spring-ai-model-id: ${QIP_EMBEDDING_MODEL_ID:spring-ai-configured}
  investigations:
    retrieval-limit: 6
    minimum-relevance-score: 0.1
    max-context-characters: 12000
    spring-ai-model-id: ${QIP_CHAT_MODEL_ID:spring-ai-configured}

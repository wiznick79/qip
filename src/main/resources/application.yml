spring:
  application:
    name: qip
  ai:
    model:
      chat: none
      embedding: none
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

qip:
  security:
    enabled: ${QIP_SECURITY_ENABLED:true}
    users:
      investigator:
        username: ${QIP_INVESTIGATOR_USERNAME:qip-investigator}
        password: ${QIP_INVESTIGATOR_PASSWORD:qip-investigator-local-only}
      reviewer:
        username: ${QIP_REVIEWER_USERNAME:qip-reviewer}
        password: ${QIP_REVIEWER_PASSWORD:qip-reviewer-local-only}
      admin:
        username: ${QIP_ADMIN_USERNAME:qip-admin}
        password: ${QIP_ADMIN_PASSWORD:qip-admin-local-only}
  documents:
    storage-directory: ${QIP_DOCUMENT_STORAGE_DIRECTORY:./data/documents}
    max-upload-bytes: 10485760
    max-pages: 500
    max-extracted-characters: 5000000
  knowledge:
    chunk-size: 800
    chunk-overlap: 120
    embedding-batch-size: 32
    fake-embedding-dimensions: 64
    spring-ai-model-id: ${QIP_EMBEDDING_MODEL_ID:spring-ai-configured}
  investigations:
    retrieval-limit: 6
    minimum-relevance-score: 0.1
    max-context-characters: 12000
    max-answer-characters: 4000
    spring-ai-model-id: ${QIP_CHAT_MODEL_ID:spring-ai-configured}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  structured:
    format:
      console: ${QIP_CONSOLE_LOG_FORMAT:logstash}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: ollama
  http:
    clients:
      connect-timeout: ${QIP_OLLAMA_CONNECT_TIMEOUT:5s}
      read-timeout: ${QIP_OLLAMA_READ_TIMEOUT:3m}
  ai:
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 500ms
        multiplier: 2
        max-interval: 2s
    model:
      chat: ollama
      embedding: ollama
    ollama:
      base-url: ${QIP_OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: never
      chat:
        model: ${QIP_OLLAMA_CHAT_MODEL:qwen3.5:9b}
        num-ctx: ${QIP_OLLAMA_CHAT_CONTEXT_LENGTH:8192}
        think: ${QIP_OLLAMA_CHAT_THINK:false}
        temperature: 0.1
        num-predict: 800
        keep-alive: 5m
      embedding:
        model: ${QIP_OLLAMA_EMBEDDING_MODEL:nomic-embed-text:latest}
        truncate: false
        keep-alive: 5m

qip:
  knowledge:
    spring-ai-model-id: ollama:${QIP_OLLAMA_EMBEDDING_MODEL:nomic-embed-text:latest}
  investigations:
    spring-ai-model-id: ollama:${QIP_OLLAMA_CHAT_MODEL:qwen3.5:9b}

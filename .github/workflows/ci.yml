name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify frontend
        working-directory: frontend
        run: npm ci && npm run verify
      - name: Verify
        run: ./mvnw --batch-mode --no-transfer-progress verify

  container:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate hosted deployment artifacts
        shell: bash
        run: |
          sh -n scripts/deploy-hosted.sh
          sh -n scripts/backup-hosted.sh
          printf 'QIP_IMAGE=ghcr.io/wiznick79/qip:0.1.0\n' > /tmp/qip-deployment.env
          docker compose \
            --env-file deploy/.env.hosted.example \
            --env-file /tmp/qip-deployment.env \
            -f deploy/compose.hosted.yaml \
            config --quiet
          docker run --rm \
            -e QIP_DOMAIN=qip.example.com \
            -e QIP_TLS_EMAIL=operator@example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2-alpine \
            caddy validate --config /etc/caddy/Caddyfile
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runtime
          push: false
          tags: qip:ci
          build-args: |
            QIP_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
